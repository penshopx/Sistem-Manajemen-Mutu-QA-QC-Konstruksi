kind = "video"
previewPath = "/qa-qc-konstruksi-video/"
title = "QA/QC Konstruksi — Video Pengenalan"
description = "Video animasi 90 detik berbahasa Indonesia yang memperkenalkan aplikasi Sistem Manajemen Pengendalian Mutu QA/QC konstruksi, alur kerja berbasis SKKNI, dan manfaatnya bagi proyek serta profesi jasa konstruksi."
version = "1.0.0"
id = "artifacts/qa-qc-konstruksi-video"
router = "path"

[[services]]
name = "web"
paths = [ "/qa-qc-konstruksi-video/" ]
localPort = 21882

[services.development]
run = "pnpm --filter @workspace/qa-qc-konstruksi-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qa-qc-konstruksi-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/qa-qc-konstruksi-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21882"
BASE_PATH = "/qa-qc-konstruksi-video/"
videoAspectRatio = "16:9"
