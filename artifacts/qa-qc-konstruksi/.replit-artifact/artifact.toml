kind = "web"
previewPath = "/"
title = "Sistem Manajemen Mutu QA/QC Konstruksi"
description = "Aplikasi web operasional untuk mengelola proyek, Quality Plan/RMK, ITP, MIR/WIR, checklist inspeksi, bukti lapangan, NCR/CAPA, dokumen terkendali, audit, dan pelaporan mutu konstruksi."
version = "1.0.0"
id = "artifacts/qa-qc-konstruksi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19636

[services.development]
run = "pnpm --filter @workspace/qa-qc-konstruksi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qa-qc-konstruksi", "run", "build" ]
serve = "static"
publicDir = "artifacts/qa-qc-konstruksi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19636"
BASE_PATH = "/"
