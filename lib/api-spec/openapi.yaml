openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Shared QA/QC project workspace
  - name: materials
    description: Project material traceability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      security: [{ clerkSession: [] }]
      summary: Get the shared project workspace
      responses:
        "200":
          description: Shared workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401": { description: Unauthenticated }
        "403": { description: Not a project member }
  /workspace/{collection}:
    post:
      operationId: createWorkspaceRecord
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Collection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericRecord" }
        "403": { description: Insufficient role }
  /workspace/{collection}/{id}:
    patch:
      operationId: updateWorkspaceRecord
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Collection"
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordUpdate" }
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenericRecord" }
        "403": { description: Insufficient role }
        "404": { description: Record not found }
    delete:
      operationId: deleteWorkspaceRecord
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Collection"
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204": { description: Deleted }
        "403": { description: Insufficient role }
        "404": { description: Record not found }
  /workspace/invitations:
    post:
      operationId: inviteProjectMember
      tags: [workspace]
      security: [{ clerkSession: [] }]
      summary: Invite a member to the current project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInvitationInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "403": { description: Only QA Engineers can invite members }
  /workspace/operations/storage-cleanup:
    get:
      operationId: getStorageCleanupOperations
      tags: [workspace]
      security: [{ clerkSession: [] }]
      summary: Get the storage cleanup status for the last 24 hours
      responses:
        "200":
          description: Storage cleanup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageCleanupOperations" }
        "401": { description: Unauthenticated }
        "403": { description: Only QA Engineers can view storage cleanup operations }
  /workspace/{collection}/{id}/attachments/upload-url:
    post:
      operationId: requestRecordAttachmentUpload
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AttachmentCollection"
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentInput" }
      responses:
        "200":
          description: Direct upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUpload" }
        "403": { description: Not a project member }
        "404": { description: Record not found }
  /workspace/{collection}/{id}/attachments:
    post:
      operationId: createRecordAttachment
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AttachmentCollection"
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentMetadataInput" }
      responses:
        "201":
          description: Attachment metadata saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "404": { description: Record or object not found }
        "400": { description: Stored object does not match allowed metadata }
        "403": { description: Insufficient role }
  /workspace/{collection}/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteRecordAttachment
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AttachmentCollection"
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "204": { description: Attachment deleted }
        "403": { description: Insufficient role }
        "404": { description: Attachment not found }
  /workspace/{collection}/{id}/attachments/{attachmentId}/content:
    get:
      operationId: downloadRecordAttachment
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AttachmentCollection"
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: Attachment not found }
  /workspace/{collection}/{id}/attachments/{attachmentId}/preview:
    get:
      operationId: previewRecordAttachment
      tags: [workspace]
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AttachmentCollection"
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Browser-compatible attachment preview
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { description: Attachment not found }
        "422": { description: Preview conversion failed }
  /materials/types:
    get:
      operationId: listMaterialTypes
      tags: [materials]
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Material types, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MaterialType" } } } } }
    post:
      operationId: createMaterialType
      tags: [materials]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialTypeInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialType" } } } }
  /materials/locations:
    get:
      operationId: listMaterialLocations
      tags: [materials]
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Storage locations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MaterialLocation" } } } } }
    post:
      operationId: createMaterialLocation
      tags: [materials]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialLocationInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialLocation" } } } }
  /materials/batches:
    get:
      operationId: listMaterialBatches
      tags: [materials]
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Material batches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MaterialBatch" } } } } }
    post:
      operationId: createMaterialBatch
      tags: [materials]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialBatchInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialBatch" } } } }
  /materials/inventory:
    post:
      operationId: placeMaterialInventory
      tags: [materials]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialInventoryInput" } } }
      responses:
        "201": { description: Placed, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialInventory" } } } }
  /materials/usage:
    post:
      operationId: recordMaterialUsage
      tags: [materials]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialUsageInput" } } }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialUsage" } } } }
        "409": { description: Insufficient stock }
  /materials/batches/{batchId}/trace:
    get:
      operationId: getMaterialBatchTrace
      tags: [materials]
      security: [{ clerkSession: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Trace, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialTrace" } } } }
  /materials/batches/{batchId}/recall:
    get:
      operationId: getMaterialBatchRecall
      tags: [materials]
      security: [{ clerkSession: [] }]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Recall impact, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialRecall" } } } }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    Collection:
      name: collection
      in: path
      required: true
      schema:
        type: string
        enum: [qualityPlans, itps, inspections, ncrs, documents, audits]
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AttachmentCollection:
      name: collection
      in: path
      required: true
      schema:
        type: string
        enum: [inspections, ncrs]
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserContext:
      type: object
      required: [id, name, role, permissions]
      properties:
        id: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [QA_ENGINEER, QC_INSPECTOR, SITE_MANAGER, PROJECT_MANAGER]
        permissions:
          type: array
          items: { type: string }
    GenericRecord:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string }
        - $ref: "#/components/schemas/RecordUpdate"
    RecordInput:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string }
        - $ref: "#/components/schemas/RecordUpdate"
    RecordUpdate:
      type: object
      additionalProperties: true
    Project:
      type: object
      required: [id, name, code, client, contractor, progress, qualityScore, status]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        client: { type: string }
        contractor: { type: string }
        progress: { type: integer }
        qualityScore: { type: integer }
        status: { type: string }
    Activity:
      type: object
      required: [id, action, subject, actor, timestamp]
      properties:
        id: { type: string }
        action: { type: string }
        subject: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }
    ProjectMember:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [QA_ENGINEER, QC_INSPECTOR, SITE_MANAGER, PROJECT_MANAGER]
        status:
          type: string
          enum: [active, invited]
    ProjectInvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [QA_ENGINEER, QC_INSPECTOR, SITE_MANAGER, PROJECT_MANAGER]
    AttachmentInput:
      type: object
      required: [fileName, contentType, size]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 26214400 }
    AttachmentMetadataInput:
      allOf:
        - $ref: "#/components/schemas/AttachmentInput"
        - type: object
          required: [objectPath]
          properties:
            objectPath: { type: string, pattern: "^/objects/uploads/[a-f0-9-]+$" }
    AttachmentUpload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    Attachment:
      type: object
      required: [id, fileName, contentType, size, createdAt, downloadUrl, previewStatus]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
        downloadUrl: { type: string }
        previewUrl: { type: ["string", "null"] }
        previewStatus:
          type: string
          enum: [original, processing, ready, failed]
        previewError: { type: ["string", "null"] }
    StorageCleanupWarning:
      type: object
      required: [level, message]
      properties:
        level:
          type: string
          enum: [notice, warning]
        message: { type: string }
    StorageCleanupRepeatedFailure:
      type: object
      required: [uploadId, failureCount]
      properties:
        uploadId: { type: string, format: uuid }
        failureCount: { type: integer, minimum: 3 }
    StorageCleanupRecentFailure:
      type: object
      required: [uploadId, error, occurredAt]
      properties:
        uploadId: { type: string, format: uuid }
        error: { type: ["string", "null"] }
        occurredAt: { type: string, format: date-time }
    StorageCleanupOperations:
      type: object
      required: [windowHours, pending, deleted, preserved, failed, warning, repeatedFailures, recentFailures]
      properties:
        windowHours: { type: integer, minimum: 1 }
        pending: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
        preserved: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        warning:
          oneOf:
            - $ref: "#/components/schemas/StorageCleanupWarning"
            - type: "null"
        repeatedFailures:
          type: array
          items: { $ref: "#/components/schemas/StorageCleanupRepeatedFailure" }
        recentFailures:
          type: array
          items: { $ref: "#/components/schemas/StorageCleanupRecentFailure" }
    MaterialType:
      type: object
      required: [id, projectId, name, category, unit, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        specification: { type: ["string", "null"] }
        unit: { type: string }
        createdAt: { type: string, format: date-time }
    MaterialTypeInput:
      type: object
      required: [name, category, unit]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        specification: { type: string }
        unit: { type: string, minLength: 1 }
    MaterialLocation:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    MaterialLocationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    MaterialBatch:
      type: object
      required: [id, projectId, materialTypeId, batchNumber, supplier, deliveryDate, quantity, unit, inspectionStatus, receivedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        materialTypeId: { type: string, format: uuid }
        batchNumber: { type: string }
        supplier: { type: string }
        deliveryDate: { type: string, format: date-time }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string }
        certificateReference: { type: ["string", "null"] }
        inspectionId: { type: ["string", "null"] }
        inspectionStatus: { type: string }
        receivedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    MaterialBatchInput:
      type: object
      required: [materialTypeId, batchNumber, supplier, deliveryDate, quantity, unit]
      properties:
        materialTypeId: { type: string, format: uuid }
        batchNumber: { type: string, minLength: 1 }
        supplier: { type: string, minLength: 1 }
        deliveryDate: { type: string, format: date-time }
        quantity: { type: integer, minimum: 1 }
        unit: { type: string, minLength: 1 }
        certificateReference: { type: string }
        inspectionId: { type: string }
        inspectionStatus: { type: string, enum: [pending, approved, rejected] }
    MaterialInventory:
      type: object
      required: [id, projectId, batchId, storageLocationId, quantity, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        storageLocationId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    MaterialInventoryInput:
      type: object
      required: [batchId, storageLocationId, quantity]
      properties:
        batchId: { type: string, format: uuid }
        storageLocationId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    MaterialUsage:
      type: object
      required: [id, projectId, batchId, location, quantity, installedDate, installedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        location: { type: string }
        quantity: { type: integer, minimum: 1 }
        installedDate: { type: string, format: date-time }
        installedBy: { type: string, format: uuid }
        inspectionId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    MaterialUsageInput:
      type: object
      required: [batchId, location, quantity, installedDate]
      properties:
        batchId: { type: string, format: uuid }
        location: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        installedDate: { type: string, format: date-time }
        inspectionId: { type: string }
        notes: { type: string }
    MaterialTrace:
      type: object
      required: [batch, inventory, usage]
      properties:
        batch: { $ref: "#/components/schemas/MaterialBatch" }
        inventory: { type: array, items: { $ref: "#/components/schemas/MaterialInventory" } }
        usage: { type: array, items: { $ref: "#/components/schemas/MaterialUsage" } }
    MaterialRecall:
      type: object
      required: [batchId, totalAffectedLocations, locations]
      properties:
        batchId: { type: string, format: uuid }
        totalAffectedLocations: { type: integer }
        locations: { type: array, items: { $ref: "#/components/schemas/MaterialUsage" } }
    Workspace:
      type: object
      required: [projects, qualityPlans, itps, inspections, ncrs, documents, audits, activities, members, currentUser]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        qualityPlans:
          type: array
          items: { $ref: "#/components/schemas/GenericRecord" }
        itps:
          type: array
          items: { $ref: "#/components/schemas/GenericRecord" }
        inspections:
          type: array
          items: { $ref: "#/components/schemas/GenericRecord" }
        ncrs:
          type: array
          items: { $ref: "#/components/schemas/GenericRecord" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/GenericRecord" }
        audits:
          type: array
          items: { $ref: "#/components/schemas/GenericRecord" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        members:
          type: array
          items: { $ref: "#/components/schemas/ProjectMember" }
        currentUser:
          $ref: "#/components/schemas/UserContext"

